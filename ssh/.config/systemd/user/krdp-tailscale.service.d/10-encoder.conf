[Service]
# Force kpipewire to software H.264 (libx264): the VA-API hardware encoder
# (h264_vaapi) segfaults here (NVIDIA VA-API is decode-only; multi-GPU encoder
# selection crashes in ff_hw_base_encode_receive_packet).
Environment=KPIPEWIRE_FORCE_ENCODER=libx264
# Also hide VA-API entirely. kpipewire picks the PipeWire buffer usage-hint from
# supportsHardwareEncoding() (presence of any VA-API device), NOT the actual
# encoder. With a VA-API device present it requests hardware *dmabuf* frames that
# the software encoder can't consume on NVIDIA, so no frames flow (black screen).
# Making VA-API unavailable flips the hint to software/SHM buffers.
Environment=LIBVA_DRIVER_NAME=none
