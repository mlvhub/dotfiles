# Kitty session file  ->  install to  ~/.config/kitty/session.conf
#
# Launches one Kitty window running Zellij. If a session named "workspace"
# already exists (you closed Kitty and reopened), it re-attaches to it with all
# your tabs/panes/CWDs intact. If not, it creates a fresh one from the
# workspace layout (your 4 project tabs).
#
# The helper function `zj` (defined in your fish config, see fish snippet) does
# the attach-or-create logic cleanly.

launch fish -C "zj"
